<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./tp-kit.js"></script>
<title>Couldn’t load · Testament</title>
<style>
body{margin:0;background:#121110}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}a:hover{text-decoration-color:currentColor}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="--bg:#121110;--surface:#1a1917;--inset:#151412;--raised:#211f1c;--line:#2a2825;--line-strong:#3d3a35;--ink:#ede9e3;--ink-2:#cfc9bf;--ink-3:#a8a298;--pass:#7fd79a;--pass-tint:#1d2a20;--fail:#f4897c;--fail-tint:#33201c;--attn:#e3b35c;--attn-tint:#302716;--neutral:#b3ada3;--neutral-tint:#252320;--on-ink:#121110;background:var(--bg);color:var(--ink);min-height:100vh">
<div data-screen-label="Server error" style="{{ themeVars }}">
<a href="#main" style="position:absolute;left:-9999px;top:12px;z-index:20;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--on-ink);font:600 14px 'Public Sans',sans-serif" style-focus="left:16px">Skip to content</a>
<div style="max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,56px);font-family:'Public Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box">

<header style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px 16px;padding:18px 0;flex-wrap:wrap">
<a href="#" style="display:flex;align-items:center;gap:10px;min-height:44px;font:600 24px/1 'Source Serif 4',serif;text-decoration:none"><span style="width:10px;height:10px;border-radius:50%;background:var(--attn)"></span><span aria-hidden="true">Test<span style="font-weight:400">ament</span></span><span style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap">Testament</span></a>
<nav style="display:flex;align-items:center;gap:0 8px;font-size:15px;flex-wrap:wrap">
<div style="position:relative"><button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="project-list" style="height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer">Projects <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div id="project-list" style="position:absolute;top:52px;left:0;width:320px;max-width:calc(100vw - 40px);padding:6px;background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-menu);z-index:10"><div style="display:flex;align-items:center;min-height:44px;padding:0 12px;font-size:14px;color:var(--ink-3)">Projects couldn’t be loaded</div></div>
</sc-if></div>
<a href="#" style="height:44px;padding:0 14px;display:flex;align-items:center;text-decoration:none">How it’s tested</a>
<span aria-hidden="true" style="flex:none;width:52px;height:0"></span>
</nav>
<div style="position:absolute;top:18px;right:0;display:flex;align-items:center;gap:4px">
<button onClick="{{ toggleTheme }}" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer" aria-label="{{ themeToggleLabel }}"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)"></span></button>
</div>
</header>

<main id="main" style="flex:1;max-width:640px;padding:40px 0 80px">
<section role="alert">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--fail-tint);color:var(--fail);font-weight:600;font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>Error</span>
<h1 style="margin:16px 0 0;font:500 clamp(34px,4.5vw,48px)/1.1 'Source Serif 4',serif;letter-spacing:-.02em;text-wrap:balance">{{ title }}</h1>
<div style="margin-top:16px;display:inline-flex;max-width:100%;padding:6px 10px;border-radius:6px;background:var(--inset);border:1px solid var(--line);font:13.5px/1.5 'JetBrains Mono',monospace;color:var(--ink-2);overflow-wrap:anywhere">{{ path }}</div>
<p style="margin:16px 0 0;font:400 19px/1.5 'Source Serif 4',serif;color:var(--ink-2);text-wrap:pretty">{{ body }}</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:20px"><a href="" style="min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--on-ink);font:600 15px 'Public Sans',sans-serif;text-decoration:none;transition:background-color 120ms ease" style-hover="background:var(--ink-2)">Try again</a><a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 8px;font-size:15px">Go to overview</a></div>
</section>
</main>

<footer style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:18px 0 32px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3)"><div style="display:flex;gap:4px"><a href="#" style="min-height:44px;display:flex;align-items:center;padding-right:16px">Privacy</a><a href="#" style="min-height:44px;display:flex;align-items:center">Source on GitHub</a></div></footer>
</div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;project&quot;,&quot;run&quot;,&quot;test&quot;],&quot;default&quot;:&quot;project&quot;,&quot;tsType&quot;:&quot;'project' | 'run' | 'test'&quot;},&quot;menu&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}">
class Component extends DCLogic {
  /* v21 item 1: a project, run or test page whose data read failed. Nothing read from the database is shown: no project name, no breadcrumbs, no Live (item 2), no "Last report received". */
  state = { theme: null, menu: null };
  componentDidMount() { if (!window.TPKit) this.wait = setInterval(() => { if (window.TPKit) { clearInterval(this.wait); this.forceUpdate(); } }, 30); }
  componentWillUnmount() { clearInterval(this.wait); }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.state.theme) this.setState({ theme: null }); if (prev.menu !== this.props.menu && this.state.menu != null) this.setState({ menu: null }); }
  renderVals() {
    const K = window.TPKit;
    const dark = (this.state.theme ?? this.props.theme ?? 'dark') === 'dark';
    const kind = this.props.kind ?? 'project';
    const menuOpen = this.state.menu ?? !!this.props.menu;
    const T = {
      project: ['This project couldn’t be loaded', '/p/ostomate2'],
      run: ['This run couldn’t be loaded', '/p/ostomate2/runs/35642780279'],
      test: ['This test’s history couldn’t be loaded', '/p/ostomate2/tests/com.ostomate.app.ui.home.HomeViewModelTest.rendersToday'],
    }[kind] || ['This project couldn’t be loaded', '/p/ostomate2'];
    const base = { title: T[0], path: T[1],
      body: 'Its results couldn’t be read just now. Nothing is shown rather than numbers that might be wrong; try again in a minute.',
      menuOpen, toggleMenu: () => this.setState({ menu: !menuOpen }),
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }), themeToggleLabel: dark ? 'Switch to light theme' : 'Switch to dark theme' };
    if (!K) return base;
    const brk = t => React.createElement(React.Fragment, null, ...K.breakPieces(t).flatMap((x, i) => i ? [React.createElement('wbr'), x] : [x])); /* v21 item 8: the path breaks after "/" and "." */
    return Object.assign(base, { themeVars: K.themeVars(dark), path: brk(T[1]) });
  }
}
</script>
</body>
</html>
