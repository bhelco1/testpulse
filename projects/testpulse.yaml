slug: testpulse
name: testpulse
tagline: Public dashboard of live test results from every project's CI, including its own.
description: >-
  Each project's CI posts its JUnit, Jest JSON, JaCoCo and istanbul output after every run, and
  testpulse turns it into pass rates, trends, test pyramids, coverage against floors, flaky tests
  and time to green. Visibility rules for private projects are enforced by row-level security in
  Postgres, not by the UI. Built test-first; its own Vitest and Playwright results report here
  like any other project's.
visibility: public
repo_url: https://github.com/bhelco1/testpulse
default_branch: main
expected_cadence_days: 8
sort_order: 30

dev_stack:
  - category: Web
    items: [Next.js 16 (App Router), React 19, TypeScript 5.9 (strict), Recharts 3]
  - category: Data
    items: ['Supabase (Postgres, Realtime, Auth)', 'Zod 4']
  - category: Delivery
    items: [GitHub Actions, Vercel]

test_stack:
  - category: Runners
    items: [Vitest 5, Playwright 1.63]
  - category: Component
    items: [Testing Library, jsdom]
  - category: Integration
    items: [Supabase CLI (local Postgres with RLS)]
  - category: Coverage
    items: [V8 via Vitest]

# CI (.github/workflows/ci.yml) posts, through .github/actions/report: Vitest unit and component
# results with coverage from the checks job (module unit), Vitest integration results from the
# integration job (module integration), and Playwright results from the e2e job (module e2e), one
# report per Playwright project with the project's name as the platform. Component tests are the
# React renders in jsdom, every *.test.tsx; the contract, stylesheet and other .test.ts files in
# the checks job are unit tests.
layer_rules:
  - match: { job: e2e }
    layer: e2e
  - match: { job: integration }
    layer: integration
  - match: { job: checks, suite: '**/*.test.tsx' }
    layer: component
  - default: unit

# The floor vitest.config.ts enforces on the unit run (coverage.thresholds.lines), keyed by the
# module whose report carries the coverage.
coverage_floors:
  unit: 90
